# -----------------------------------------------------------------------------
# Site
# -----------------------------------------------------------------------------

title: Muhammad Talha
tagline: AI for Earth-system prediction
description: >-
  Muhammad Talha is a Ph.D. candidate at Michigan State University and a research intern at
  Oak Ridge National Laboratory, building multimodal foundation models, graph neural networks,
  and spatiotemporal transformers for hydrologic prediction.
url: "https://muhammad-talha-mt.github.io"
baseurl: ""
lang: en
timezone: America/New_York

author:
  name: Muhammad Talha
  role: Ph.D. Candidate · Michigan State University
  affiliation: Research Intern · Oak Ridge National Laboratory
  location: Oak Ridge, Tennessee
  photo: /assets/img/prof_pic.jpg
  cv_pdf: /assets/CV_Talha.pdf

# Main navigation (in order)
nav:
  - title: Research
    url: /projects/
  - title: Publications
    url: /publications/
  - title: Code
    url: /repositories/
  - title: News
    url: /news/
  - title: CV
    url: /cv/

# jekyll-seo-tag
social:
  name: Muhammad Talha
  links:
    - https://github.com/Muhammad-Talha-MT
    - https://www.linkedin.com/in/mt-muhammad-talha
    - https://orcid.org/0000-0001-5096-544X

# -----------------------------------------------------------------------------
# Content
# -----------------------------------------------------------------------------

collections:
  projects:
    output: true
    permalink: /:collection/:path/
  news:
    output: false

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: "_pages"
    values:
      layout: page

include: ["_pages"]

# Files that belong to the previous al-folio setup or to tooling are not part of the site.
exclude:
  - _posts/
  - _books/
  - _teachings/
  - .agents/
  - .codex/
  - .gemini/
  - .devcontainer/
  - .github/
  - bin/
  - docs/
  - test/
  - readme_preview/
  - lighthouse_results/
  - node_modules/
  - vendor/
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - purgecss.config.js
  - package.json
  - package-lock.json
  - requirements.txt
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - LICENSE
  - _data/featured_plugins.yml
  - _pages/plugins.md
  - _pages/blog.md
  - assets/audio/
  - assets/video/
  - assets/plotly/
  - assets/jupyter/
  - assets/json/
  - assets/html/
  - assets/pdf/
  - assets/rendercv/
  - assets/bibliography/
  - assets/img/book_covers/
  - assets/img/publication_preview/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

plugins:
  - jekyll/scholar
  - jekyll-seo-tag
  - jekyll-sitemap
  - jemoji

# -----------------------------------------------------------------------------
# Publications (jekyll-scholar)
# -----------------------------------------------------------------------------

scholar:
  last_name: [Talha]
  first_name: [Muhammad]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending
  sort_by: year
  order: descending
  # Fields used only by this site; hidden from the "BibTeX" export on the publications page.
  bibtex_skip_fields: [abbr, bibtex_show, code, google_scholar_id, html, pdf, selected, altmetric, dimensions, preview]
