cv:
  name: Muhammad Talha
  label: Ph.D. Candidate, Computer Science & Biosystems and Agricultural Engineering
  email: talhamuh@msu.edu
  location: Oak Ridge, Tennessee
  image: ""
  summary: >-
    Dual-major Ph.D. candidate developing AI for Earth-system prediction through multimodal foundation models,
    graph neural networks, spatiotemporal transformers, and transferable representations. At Oak Ridge National
    Laboratory, contributing to the Genesis-funded HydroORBIT project and graph-based hydrologic modeling.
    Experience integrating environmental observations, geospatial attributes, and numerical-model simulations.

